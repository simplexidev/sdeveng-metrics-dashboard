name: Deploy metrics dashboard

on:
  push:
    branches: [main, develop/v3.0.0]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: simplexidev/sdeveng-metrics-tooling
          ref: develop/v3.0.0
          path: dependencies/tooling
      - uses: actions/checkout@v4
        with:
          repository: simplexidev/sdeveng-metrics-data
          ref: develop/v3.0.0
          path: dependencies/data
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: dependencies/tooling/global.json
      - run: dotnet restore dependencies/tooling/SdevEng.Metrics.slnx
      - run: dotnet build dependencies/tooling/SdevEng.Metrics.slnx --no-restore
      - run: dotnet test dependencies/tooling/SdevEng.Metrics.slnx --no-build
      - run: dotnet run --project dependencies/tooling/src/SdevEng.Metrics --no-build -- publish-pages . dependencies/data/public _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
